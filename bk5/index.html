<body>
  <script>
    /* Phone browsers draw an address bar on top and a toolbar below, and they come and go. 100vh counts the area behind them, so the game
       measures the part you can actually see (visualViewport) and sizes itself to that, on load, rotation, and whenever the bars move. */
    (function () {
      function fit() {
        var v = window.visualViewport, h = v ? v.height : window.innerHeight, t = v ? v.offsetTop : 0;
        document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
        document.documentElement.style.setProperty('--app-top', Math.round(t) + 'px');
        if (window.scrollY || t) window.scrollTo(0, 0);
      }
      fit();
      window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
      if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
      window.addEventListener('pageshow', fit); window.addEventListener('focus', fit);
    })();
  </script>
  <script>
    /* PC or phone: a real desktop (a mouse that hovers, a big enough window) gets its own layout, not a stretched phone screen.
       Settings can force either. It is decided before the first draw and again whenever the window changes size. */
    (function () {
      function pick() {
        var o = ''; try { o = localStorage.getItem('crisis_layout') || ''; } catch (e) {}
        var fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
        var pc = o === 'pc' || (o !== 'phone' && fine && innerWidth >= 1100 && innerHeight >= 620);
        var el = document.documentElement, was = el.classList.contains('pc'); el.classList.toggle('pc', pc);
        if (was !== pc && window.Crisis && window.Crisis.relayout) window.Crisis.relayout();
      }
      pick(); window.addEventListener('resize', pick); window.__pickLayout = pick;
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      /* a new version takes over at once: reload one time so players never run yesterday's files */
      const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
      navigator.serviceWorker.register('sw.js').then((r) => { try { r.update(); } catch (e) {} }).catch(() => { });
    }
  </script>
